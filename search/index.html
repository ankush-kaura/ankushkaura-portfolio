ded work into more hours of the day, often without being asked to do so. Importantly, the company did not mandate AI use (though it did offer enterprise subscriptions to commercially available AI tools). On their own initiative workers did more because AI made “doing more” feel possible, accessible, and in many cases intrinsically rewarding.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"While this may sound like a dream come true for leaders, the changes brought about by enthusiastic AI adoption can be unsustainable, causing problems down the line. Once the excitement of experimenting fades, workers can find that their workload has quietly grown and feel stretched from juggling everything that’s suddenly on their plate. That workload creep can in turn lead to cognitive fatigue, burnout, and weakened decision-making. The productivity surge enjoyed at the beginning can give way to lower quality work, turnover, and other problems.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"This puts leaders in a bind. What should they do? Asking employees to self-regulate isn’t a winning strategy. Rather, companies need to develop a set of norms and standards around AI use, what we call an “AI practice.” Here’s what leaders need to know, and what they can do to set their employees up for success.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"How Generative AI Intensifies Work","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"From April to December last year, we studied how generative AI tools changed work habits at the tech company. We identified three main forms of intensification.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Task expansion. ","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Because AI can fill in gaps in knowledge, workers increasingly stepped into responsibilities that previously belonged to others. Product managers and designers began writing code, researchers took on engineering tasks, and individuals across the organization attempted work they would have outsourced, deferred, or avoided entirely in the past.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Generative AI made those tasks feel newly accessible. These tools provided what many experienced as an empowering cognitive boost: They reduced dependence on others, and offered immediate feedback and correction along the way. Workers described this as “just trying things” with the AI, but these experiments accumulated into a meaningful widening of job scope. In fact, workers increasingly absorbed work that might previously have justified additional help or headcount.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"There were knock-on effects of people expanding their remits. For instance, engineers, in turn, spent more time reviewing, correcting, and guiding AI-generated or AI-assisted work produced by colleagues. These demands extended beyond formal code review. Engineers increasingly found themselves coaching colleagues who were “vibe-coding” and finishing partially complete pull requests. This oversight often surfaced informally in Slack threads or quick desk-side consultations adding to engineer's workloads.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Blurred boundaries between work and non-work.","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Because AI made beginning a task so easy it reduced the friction of facing a blank page or unknown starting point, workers slipped small amounts of work into moments that had previously been breaks. Many prompted AI during lunch, in meetings, or while waiting for a file to load. Some described sending a “quick last prompt” right before leaving their desk so that the AI could work while they stepped away.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"These actions rarely felt like doing more work, yet over time they produced a workday with fewer natural pauses and a more continuous involvement with work. The conversational style of prompting further softened the experience, typing a line to an AI system felt closer to chatting than to undertaking a formal task, making it easy for work to spill into evenings or early mornings without deliberate intention.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Some workers described realizing, often in hindsight, that as prompting during breaks became habitual, downtime no longer provided the same sense of recovery. As a result, work felt less bounded and more ambient but something that could always be advanced a little further. The boundary between work and non-work did not disappear, but it became easier to cross.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"More multitasking.","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":" AI introduced a new rhythm in which workers managed several active threads at once: manually writing code while AI generated an alternative version, running multiple agents in parallel, or reviving long-deferred tasks because AI could “handle them” in the background. They did this, in part, because they felt they had a “partner” that could help them move through their workload.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"While this sense of having a “partner” enabled a feeling of momentum, the reality was a continual switching of attention, frequent checking of AI outputs, and a growing number of open tasks. This created cognitive load and a sense of always juggling, even as the work felt productive.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Over time, this rhythm raised expectations for speed, not necessarily through explicit demands, but through what became visible and normalized in everyday work. Many workers noted that they were doing more at once and feeling more pressure than before they used AI, even though the time savings from automation had ostensibly been meant to reduce such pressure.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"What This Means for Organizations and How an “AI Practice” Can Help","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"All of this produced a self reinforcing cycle. AI accelerated certain tasks, which raised expectations for speed; higher speed made workers more reliant on AI. Increased reliance widened the scope of what workers attempted, and a wider scope further expanded the quantity and density of work. Several participants noted that although they felt more productive, they did not feel less busy, and in some cases felt busier than before. As one engineer summarized, “","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"You had thought that maybe, oh, because you could be more productive with AI, then you save some time, you can work less. But then really, you don’t work less. You just work the same amount or even more.","nodeType":"text"},{"data":{},"marks":[],"value":"”","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Organizations might see this voluntary expansion of work as a clear win. After all, if workers are doing this of their own initiative, why would that be bad? Isn’t this the productivity explosion we’ve been promised?","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"But our research reveals the risks of letting work informally expand and accelerate: What looks like higher productivity in the short run can mask silent workload creep and growing cognitive strain as employees juggle multiple AI enabled workflows. Because the extra effort is voluntary and often framed as enjoyable experimentation, it is easy for leaders to overlook how much additional load workers are carrying. Over time, overwork can impair judgment, increase the likelihood of errors, and make it harder for organizations to distinguish genuine productivity gains from unsustainable intensity. For workers, the cumulative effect is fatigue, burnout, and a growing sense that work is harder to step away from, especially as organizational expectations for speed and responsiveness rise.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Instead of responding passively to how AI tools reshape workplaces, both individuals and companies should adopt an “AI practice”: a set of intentional norms and routines that structure how AI is used, when it is appropriate to stop, and how work should and should not expand in response to newfound capability. Without such practices, the natural tendency of AI assisted work is not contraction but intensification, with implications for burnout, decision quality, and long-term sustainability.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"As organizations work to build their AI practice, they should consider adopting:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Sequencing.","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"As AI enables constant activity in the background, organizations can benefit from norms that deliberately shape when work moves forward, not just how fast. This includes batching non-urgent notifications, holding updates until natural breakpoints, and protecting focus windows in which workers are shielded from interruptions.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rather than reacting to every AI generated output as it appears, sequencing encourages work to advance in coherent phases. When coordination is paced in this way, workers experience less fragmentation and fewer costly context switches, while teams maintain overall throughput. By regulating the order and timing of work, rather than demanding continuous responsiveness, sequencing can help organizations preserve attention, reduce cognitive overload, and support more thoughtful decision-making in AI forward workplaces.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Human grounding.","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":" As AI enables more solo, self-contained work, organizations can benefit from protecting time and space for listening and human connection. Short opportunities to connect with others whether through brief check-ins, shared reflection moments, or structured dialogue interrupt continuous solo engagement with AI tools and help restore perspective.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Beyond perspective, social exchange supports creativity. AI provides a single, synthesized perspective, but creative insight depends on exposure to multiple human viewpoints. By institutionalizing time and space for listening and dialogue, organizations re-anchor work in social context and help counter the depleting, individualizing effects of fast, AI mediated work.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"heroImage":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"24lIiLgzdQPWquB4bx7Fu1","type":"Asset","createdAt":"2026-02-23T05:51:54.548Z","updatedAt":"2026-02-23T05:51:54.548Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":4,"revision":1,"locale":"en-US"},"fields":{"title":"AI Doesn’t Reduce Work, It Intensifies It","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/24lIiLgzdQPWquB4bx7Fu1/e0e44c33ebd1b932007ff784d88e438f/image.png","details":{"size":2552000,"image":{"width":1536,"height":1024}},"fileName":"image.png","contentType":"image/png"}}},"date":"2026-02-22T00:00+05:30"}},{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"UD12fBnQ02gioAA2pqsfe","type":"Entry","createdAt":"2026-02-06T13:33:41.574Z","updatedAt":"2026-02-06T13:34:26.047Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":11,"revision":2,"contentType":{"sys":{"type":"Link","linkType":"ContentType","id":"4iLx5UCNPIE6SrGNHluzUR"}},"locale":"en-US"},"fields":{"title":"Do not give up your brain","slug":"do-not-give-up-your-brain","description":"I do use AI for work, and often shill AI for work, and use it often on side projects.\n\nThat being said, I really care about using AI as a tool, rather than a replacement for my own thoughts and ideas. I think it’s very important to not default to laziness and just asking for the answer to something, especially when thinking a liiiiittle bit can get you there.","content":{"nodeType":"document","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"I do use AI for work, and often shill AI for work, and use it often on side projects.","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"That being said, I really care about using AI as a tool, rather than a replacement for my own thoughts and ideas. I think it’s very important to not default to laziness and just asking for the answer to something, especially when thinking a liiiiittle bit can get you there.","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"I’ve seen multiple people now who are really good at communicating online, but then when you converse with them in person, they freeze up, and it turns out it’s because they’ve been letting ChatGPT (or whatever they’re using) come up with responses for them in chats and emails. I know people who are afraid to write a professional email themselves now and they run it through their AI tool several times before shipping it. This type of dependence is the world we’re careening towards as a society at this rate, and it’s not a good thing.","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"It’s really tempting to say that you’re just “using the resources you have” when you use a simple query here and there, but your brain is the best resource you’ll have for the rest of your life, and you should keep it sharp.","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Anyway, I might be saying the obvious, so let me leave you with this quote:","marks":[],"data":{}}]},{"nodeType":"blockquote","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"“Once men turned their thinking over to machines in the hope that this would set them free. But that only permitted other men with machines to enslave them.”","marks":[],"data":{}}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"- Frank Herbert, Dune","marks":[],"data":{}}]}]},"heroImage":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"3JmdtWIZKM5tnMNNa60tk0","type":"Asset","createdAt":"2026-02-06T13:33:16.793Z","updatedAt":"2026-02-06T13:33:16.793Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":4,"revision":1,"locale":"en-US"},"fields":{"title":"Do not give up your brain","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/3JmdtWIZKM5tnMNNa60tk0/cc1bd3217573fb836c72a8be65b7f948/image.png","details":{"size":975113,"image":{"width":1018,"height":477}},"fileName":"image.png","contentType":"image/png"}}},"date":"2026-02-06T00:00+05:30"}},{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"4cbkOBopJPKoQwLkYh7e9u","type":"Entry","createdAt":"2026-02-06T13:03:50.134Z","updatedAt":"2026-02-06T13:07:44.226Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":12,"revision":2,"contentType":{"sys":{"type":"Link","linkType":"ContentType","id":"4iLx5UCNPIE6SrGNHluzUR"}},"locale":"en-US"},"fields":{"title":"How a 3D Printer With AI Became the MVP of My Server Management Stack","slug":"how-a-3d-printer-with-ai-became-the-mvp-of-my-server-management-stack","description":"Running infrastructure feels like a full-contact sport. One bad outage and your SLAs go up in flames. Scaling never happens when you want it to. And hardware failures? They love showing up at 3 AM like they’re doing you a favor. I hit a point where I needed a real shift not another dashboard with neon graphs, but an actual co-pilot for ops.\n","content":{"nodeType":"document","data":{},"content":[{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"Why the Old Ops Model Had to Go","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Traditional infrastructure is slow and painfully outdated:","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"You’re chained to vendor timelines and useless support queues.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Replacement cycles never match real-world usage.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Stocking spare parts is basically burning money.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Even tiny datacenter fixes still require someone to physically do the thing.","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"That whole model is legacy and legacy just means liability.","marks":[],"data":{}}]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"The New Workflow: AI + 3D Printing Running Ops Like a Pro","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Here’s how the new pipeline works:","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"1. ML predicts hardware issues before they become issues","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"AI constantly watches thermal drift, vibration noise, PSU variance all the subtle signals humans usually miss. It flags parts long before Grafana even twitches.","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"2. Automated fabrication kicks in","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"As soon as the failure probability crosses the threshold, the printer gets to work. It churns out:","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Fan brackets","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Cable clips","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"SSD mounts","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Airflow channels","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Structural supports","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Emergency covers","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Zero procurement loops. Zero waiting.","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"3. The AI doesn’t just print, it optimizes","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"The model runs simulations like finite-element analysis and thermal/airflow modelling. Every printed part is better than the last. Your hardware literally upgrades itself over time.","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"4. Install is either robotic or human with AR assist","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Depending on the datacenter setup:","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"A robot arm installs the part, or","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"A technician uses AR overlays that walk them through the exact steps","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"No confusion. No downtime.","marks":[],"data":{}}]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"The Actual Wins (a.k.a. Why This Matters)","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"70% drop in hardware-related downtime","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"MTTR cut almost in half","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Parts cost basically zero","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Low-risk incidents become fully autonomous","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Scaling during traffic surges feels like flipping a switch","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Best of all? No vendor lock-in. The entire pipeline is vertically owned.","marks":[],"data":{}}]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"The Bigger Picture: Self-Repairing Infrastructure","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"This system pushes us toward something wild: datacenters that heal themselves.","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"AI detects the failure","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"AI designs the fix","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"AI manufactures it","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"AI deploys it","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Humans just keep an eye on things and sip coffee.","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Server management stops being a never-ending firefight and turns into a horsepower multiplier for growth.","marks":[],"data":{}}]}]},"heroImage":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"6RSwIt7lHfAkIJgFx4ij5V","type":"Asset","createdAt":"2026-02-06T13:03:20.571Z","updatedAt":"2026-02-06T13:03:20.571Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":4,"revision":1,"locale":"en-US"},"fields":{"title":"How a 3D Printer With AI Became the MVP of My Server Management Stack","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/6RSwIt7lHfAkIJgFx4ij5V/ca8a028642d4ad4348f7f61585a1ba19/image.png","details":{"size":2695490,"image":{"width":1536,"height":1024}},"fileName":"image.png","contentType":"image/png"}}},"date":"2026-02-05T00:00+05:30"}},{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"7gRCFj46cfYEx3qNoowgP2","type":"Entry","createdAt":"2026-01-16T13:30:23.379Z","updatedAt":"2026-01-16T13:30:23.379Z","env  Needs to Self-Host","slug":"every-developer-needs-to-self-host","description":"Self hosting is not just about saving money or going off grid. It is about learning the skills that power the internet and unlocking opportunities you might not even know exist yet.","content":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Self hosting is not just about saving money or going off grid.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"It is about learning the skills that power the internet and unlocking opportunities you might not even know exist yet.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Self Hosting Teaches You How Software Really Runs","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"When you self host something, you go beyond \"npm start\" and start thinking like an operator.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"You need to:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Make sure your app does not crash silently using something like systemd or PM2","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Expose the right ports to the outside world","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Persist data across reboots","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Understand how the operating system manages services and files","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"You stop thinking like just a developer and start thinking like someone responsible for keeping systems online. That is not something you learn from pushing to Heroku or clicking a deploy button.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"You Learn Networking by Doing","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Self hosting forces you to figure out:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"How DNS records work","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"What a reverse proxy does","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"How to issue SSL certificates","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"What causes a misrouted request","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"7 Years back, I had no idea what a CNAME was. I just wanted my server to be reachable at a nice looking domain.\nBut in the process, I learned more about DNS, NAT, and port forwarding than I ever did in university! Those same skills apply to modern stacks like Kubernetes and cloud infrastructure. The fundamentals do not change.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"You Start Thinking About Security","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"When you expose software to the internet, you begin asking better questions:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Is there an admin panel open to the world?","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Is my database protected by a strong password? Should it even be exposed?","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Am I using HTTPS correctly?","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"If you have ever accidentally left an SSH instance or Redis port exposed, you learn quickly that the internet is not a friendly place. Just look at how many SSH login attempts you get on your server that are not from you!","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"These lessons make you a better developer. You stop building only for functionality and start thinking about safety and resilience.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"You Learn DevOps Without Trying","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"I never set out to learn DevOps. I just wanted to run a few services for personal use. A website. A NAT server etc.\nBut I ended up learning:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Docker and Docker Compose","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Persistent volumes and health checks","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"How to recover from crashes","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"How to automate deployments","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"That accidental education became a rabit hole and then a career addon.","nodeType":"text"},{"data":{},"marks":[],"value":" Later I worked on serious production infrastructure, and my early self hosting experience gave me a huge advantage.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"You do not need to become a DevOps engineer to benefit from this. Self hosting gives you a mental model of how the internet works. That is valuable no matter what you build!","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Self Hosting Builds Confidence","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Self hosting teaches you how to troubleshoot problems in the real world.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"SSH into a server and read logs? No problem","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Debug a DNS issue? You have done it before","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Migrate a database without downtime? You know what to watch for","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"Once you have hosted something yourself, production environments stop being scary. You become comfortable with the tools and processes that keep real applications online. You think like a builder, not just a coder.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Where to Start","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"You do not need a rack of servers or a ton of time to self host something useful.\nI would always recommend hosting something you use every day. If you need some ideas, here are some great options to begin with:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"n8n","nodeType":"text"},{"data":{},"marks":[],"value":" - for no code workflow automation","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Uptime Kuma - ","nodeType":"text"},{"data":{},"marks":[],"value":"to monitor your websites","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Plausible Analytics - ","nodeType":"text"},{"data":{},"marks":[],"value":"for privacy focused web analytics","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Postgres with Adminer - ","nodeType":"text"},{"data":{},"marks":[],"value":"to explore databases","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Caddy or Traefik - ","nodeType":"text"},{"data":{},"marks":[],"value":"for auto HTTPS and reverse proxying","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"Pick one and deploy it on a ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"cheap VPS","nodeType":"text"},{"data":{},"marks":[],"value":" or My fav. ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"Raspberry pi","nodeType":"text"},{"data":{},"marks":[],"value":". ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Break things. Fix them. Break them again.","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Final Thoughts","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"You do not need to self host everything.\nYou do not need to be a system administrator.\nBut you should try it at least once.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Start small. Start messy. Start now.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"You might just surprise yourself","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"heroImage":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"7mYPmLKj7ss1JuGSja9C9a","type":"Asset","createdAt":"2025-11-18T06:41:31.751Z","updatedAt":"2025-11-18T06:41:31.751Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":5,"revision":1,"locale":"en-US"},"fields":{"title":"Self Hosting","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/7mYPmLKj7ss1JuGSja9C9a/2f763e03e89ba84a983b7be44c1b9d09/image.png","details":{"size":65903,"image":{"width":364,"height":139}},"fileName":"image.png","contentType":"image/png"}}},"date":"2025-11-18T00:00+05:30"}},{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"1hxDrJiu7HXK2WbO6O3qsP","type":"Entry","createdAt":"2025-11-13T07:30:56.548Z","updatedAt":"2025-11-13T07:30:56.548Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":49,"revision":1,"contentType":{"sys":{"type":"Link","linkType":"ContentType","id":"4iLx5UCNPIE6SrGNHluzUR"}},"locale":"en-US"},"fields":{"title":"Nobody wants to be the boss anymore. Here’s why, in just 7 words","slug":"nobody-wants-to-be-the-boss-anymore","description":"New research shows only 30% of workers want to become managers. Here’s why, and what your organization can do about it.","content":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"according to recent research from LinkedIn. In a survey of more than 10,000 LinkedIn users, nearly 7 in 10 said they would leave their job if they had a bad manager. But only 30% said they want to become a people manager within the next few years.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"So, why the change? Why doesn’t anyone want to be the boss anymore?","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"We could sum up the answer in seven words: ","nodeType":"text"},{"data":{},"marks":[{"type":"italic"},{"type":"bold"}],"value":"Nobody showed them how to lead effectively.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Global consulting firms surveyed number of managers and found that 66% of those received eight hours or less of manager training. Of those who had been managers for less than a year, a stunning 43% had received no training at all.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Why is this lack of training so problematic? And, more importantly, how can you inspire and prepare the next generation of leaders at your organization?","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The leadership training gap","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"The problem is the skills that get people promoted aren’t the ones that help them excel at the next level. Management experts explore this concept and they describe five different leadership roles:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Leading self","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Leading others","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Leading leaders","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Functional leaders","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Business leaders","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"The passage from one role to another requires new learning and new behavior, assert the authors. What’s more, they say, the leader who transitions from one role to the next has to acquire a new way of leading and leave the old ways behind. This calls for a fundamental adjustment in skills and in the way you use your time.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The challenge here is that many of the things leaders need to stop doing are things they enjoy doing and which have brought them success.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"},{"type":"italic"}],"value":"For Example:","nodeType":"text"},{"data":{},"marks":[],"value":" ","nodeType":"text"},{"data":{},"marks":[{"type":"italic"}],"value":"a sales manager may be great at closing deals. But once he or she is promoted, closing deals on their own should no longer be the most important thing. Rather, they should be concerned with helping their reports to excel for example, clarifying target setting, giving emotionally intelligent feedback, and coaching and development. This change in perspective will affect everything from what they believe is important to how they define success and how they allocate their time. It will also impact the effect they have on their people and the organization as a whole.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The change in perspective should continue as a leader continues to transition across roles. A leader of leaders must recruit the right leaders and hold them accountable for their role in developing their people. A functional leader has to not only lead but also build competitive advantages and agendas that enable the company to do things better than competitors.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"A business leader’s focus is long term, but he or she must also stay in touch with the short-term picture. Business leaders must develop strategy and build teams down the chain that assist in executing that strategy. One thing that all of these roles hold in common? They each demand ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"emotional intelligence, skills and abilities","nodeType":"text"},{"data":{},"marks":[],"value":" like listening, empathy, effective processing, and delivering of feedback.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"How to fix your leadership problem","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"How do you make sure your organization is preparing your leaders and managers for success? Here are some tips.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Map leadership passages: ","nodeType":"text"},{"data":{},"marks":[],"value":"Define the transitions in your organization (individual contributor, manager one, manager two, etc.). Specify what emotional skills are needed at each stage.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Develop training:","nodeType":"text"},{"data":{},"marks":[],"value":" Whether designed in-house, with help from a leadership consultancy, or both, tailor management and leadership training to your organization.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Schedule time:","nodeType":"text"},{"data":{},"marks":[],"value":" Each time a person is promoted, schedule the training and make sure you provide the time and resources they need to complete it.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Provide a mentor:","nodeType":"text"},{"data":{},"marks":[],"value":" A mentor can guide the person’s development, answer questions, and support them emotionally. Where possible, allow the person to choose their own mentor.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Support mentors, too:","nodeType":"text"},{"data":{},"marks":[],"value":" Outline guidelines for how mentors can help, and a program for them to meet regularly (in addition to impromptu (","nodeType":"text"},{"data":{},"marks":[{"type":"italic"}],"value":"done without been planned","nodeType":"text"},{"data":{},"marks":[],"value":") meetings when needed).","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Measure outcomes: ","nodeType":"text"},{"data":{},"marks":[],"value":"Track metrics and results, but also look beneath the surface. Pay special attention to retention/turnover, team engagement, conflict rates. Remember, metrics are important but interviews with direct reports and team members can reveal much.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Lead by example: ","nodeType":"text"},{"data":{},"marks":[],"value":"Senior leaders must practice developing their emotional intelligence, share their mistakes and learnings, and ask for help. In doing so, they set the foundation for the culture. Don’t just dump a person into a new role and expect them to figure it out. Some will. Many won’t.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[],"nodeType":"hr"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Final Words:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"In contrast, if you prioritize leadership development, you’ll strengthen your teams ","nodeType":"text"},{"data":{},"marks":[{"type":"italic"}],"value":"and","nodeType":"text"},{"data":{},"marks":[],"value":" the organization as a whole—not just today but into the future.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"italic"}],"value":"Credit : Justin Bariso","nodeType":"text"}],"nodeType":"heading-6"},{"data":{},"content":[{"data":{},"marks":[],"value":"","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"heroImage":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"3o4sLq62adI3TKQvmYkdmY","type":"Asset","createdAt":"2025-11-13T07:30:50.829Z","updatedAt":"2025-11-13T07:30:50.829Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":4,"revision":1,"locale":"en-US"},"fields":{"title":"Leadership","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/3o4sLq62adI3TKQvmYkdmY/e9edd3678c93e7ebe2fc97113695a720/image.png","details":{"size":1813273,"image":{"width":1920,"height":1080}},"fileName":"image.png","contentType":"image/png"}}},"date":"2025-11-13T00:00+05:30"}},{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"3OwfLxy0gLimOsbT4DkfY7","type":"Entry","createdAt":"2025-11-10T05:12:22.637Z","updatedAt":"2025-11-10T05:12:22.637Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":39,"revision":1,"contentType":{"sys":{"type":"Link","linkType":"ContentType","id":"4iLx5UCNPIE6SrGNHluzUR"}},"locale":"en-US"},"fields":{"title":"Artificial intelligence glossary | 60+ terms to know","slug":"artificial-intelligence-glossary","description":"AI is moving fast and can be hard to keep up in real time. Use this glossary as a reference for AI terms.","content":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"It is getting harder to keep up with AI and the growing list of jargon and scientific terms surrounding it.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Throughout its history, AI has gone through hot and cold periods of hype. In the periods of hype -- now with the explosion of large language models -- new terms always make their way into public parlance.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Yet, there are many people who hear the term ","nodeType":"text"},{"data":{},"marks":[{"type":"italic"}],"value":"AI","nodeType":"text"},{"data":{},"marks":[],"value":" and it doesn't register. Or they have heard it in passing but only vaguely know what it is. There are also different levels of awareness.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"This glossary aims to serve both as a resource for those just being introduced to AI and for those looking for a reference or to refresh their vocabulary.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Agent. ","nodeType":"text"},{"data":{},"marks":[],"value":"An intelligent agent is an AI system that can independently perceive its environment and act autonomously to reach an objective. The environment may be simulated or physical and doesn't need repeated prompting to achieve a bigger task.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"AI alignment. ","nodeType":"text"},{"data":{},"marks":[],"value":"AI alignment is the process of trying to get an AI system to function as intended. Alignment covers both small, direct goals, such as writing a sentence, and large conceptual ones, such as conforming to certain values and moral standards. As AI systems and their target goals get more complex, aligning them becomes more difficult.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"AI governance.","nodeType":"text"},{"data":{},"marks":[],"value":" AI governance refers to the policies, regulations and frameworks designed to guide the responsible development of AI technologies.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Algorithm.","nodeType":"text"},{"data":{},"marks":[],"value":" An algorithm is a step-by-step procedure or set of instructions that a computer follows. In the context of AI, an algorithm can be used by machine learning systems to ingest data and make predictions based on it.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Anthropomorphism. ","nodeType":"text"},{"data":{},"marks":[],"value":"Anthropomorphism is the tendency to attribute human qualities to nonhumans. For example, calling a chatbot \"he\" or \"she,\" saying a chatbot wants something or saying a chatbot is trying to do something is anthropomorphizing AI. This happens often in conversations about artificial intelligence because it is often designed to sound or appear human.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Artificial general intelligence (AGI). ","nodeType":"text"},{"data":{},"marks":[],"value":"AGI is a machine that can perform any intellectual task that a human can. AGI is a category of AI. There are no current AI systems that count as AGI, though some claim that recent technologies, such as GPT-4, come close.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Artificial intelligence (AI). ","nodeType":"text"},{"data":{},"marks":[],"value":"AI is the simulation of human intelligence processes by computer systems.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Bias. ","nodeType":"text"},{"data":{},"marks":[],"value":"Machine learning bias, or AI bias, occurs when algorithms produce results that are systemically prejudiced. Bias can be present in the code of an AI system or the data it trains on. Machine learning bias can affect decision-making.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Black box AI. ","nodeType":"text"},{"data":{},"marks":[],"value":"Black box AI systems' operations are not visible. The user provides input, and the machine provides an output. But the exact steps the machine took to arrive at the response are opaque. Explainable AI is the antithesis of black box AI. Its exact logic and operations are transparent.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"ChatGPT. ","nodeType":"text"},{"data":{},"marks":[],"value":"ChatGPT is a chatbot from OpenAI that inspired a wave of public attention directed toward large language models and generative AI. It uses algorithms to produce text responses to user input in natural language.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Chatbot. ","nodeType":"text"},{"data":{},"marks":[],"value":"A chatbot is an AI-powered tool designed to communicate with people in a conversational way. ChatGPT is an example of a chatbot. Generative AI chatbots are sometimes used as an alternative to search engines for information retrieval.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Constitutional AI. ","nodeType":"text"},{"data":{},"marks":[],"value":"Constitutional AI trains AI systems to align with a set of values or principles as defined in a constitution. This approach was developed by AI startup Anthropic.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Convolutional neural network (CNN). ","nodeType":"text"},{"data":{},"marks":[],"value":"CNNs are a subset technology of machine learning and deep learning that are used in computer vision.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Corpus. ","nodeType":"text"},{"data":{},"marks":[],"value":"A corpus is","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":" ","nodeType":"text"},{"data":{},"marks":[],"value":"a large data set of written or spoken words that is used to train language models.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Copilot. ","nodeType":"text"},{"data":{},"marks":[],"value":"Copilot is the brand name of Microsoft's suite of AI-assisted workplace products.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Cutoff date. ","nodeType":"text"},{"data":{},"marks":[],"value":"The cutoff date is the date at which the model's information ends. AI models can't recall information past the cutoff date. For example, GPT-3.5's cutoff date is September 2021.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Data mining. ","nodeType":"text"},{"data":{},"marks":[],"value":"Data mining is the process of searching for data and looking for patterns within a large data set to extract useful information. Names of entities in the data set are one example of data that mining processes can extract.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Data validation. ","nodeType":"text"},{"data":{},"marks":[],"value":"Data validation is the process of checking the quality of data before using it to develop and train AI models.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Dall-E. ","nodeType":"text"},{"data":{},"marks":[],"value":"Dall-E is OpenAI's AI-powered image generator. Users submit a text prompt, and the AI tool generates a corresponding image.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Deepfake. ","nodeType":"text"},{"data":{},"marks":[],"value":"A deepfake is a convincing AI-generated image, audio or video hoax. A deepfake can be entirely original content that shows someone doing or saying something they didn't do or say. They can also depict fake news events. A deepfake of the Pentagon exploding went viral in May 2023 and had a tangible effect on the stock market.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Deep learning. ","nodeType":"text"},{"data":{},"marks":[],"value":"Deep learning is a type of machine learning that imitates the way humans gain certain types of knowledge.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Embodied agents. ","nodeType":"text"},{"data":{},"marks":[],"value":"Embodied agents, also referred to as ","nodeType":"text"},{"data":{},"marks":[{"type":"italic"}],"value":"embodied AI","nodeType":"text"},{"data":{},"marks":[],"value":", are AI agents with a physical body that perform specific tasks in the physical environment.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Emergence. ","nodeType":"text"},{"data":{},"marks":[],"value":"Emergence describes capabilities that arise in AI systems unpredictably as they become more complex. A system's emergent properties are not observable in its individual parts.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"EU AI Act. ","nodeType":"text"},{"data":{},"marks":[],"value":"The EU AI Act is a regulatory framework for responsible AI deployment in a way that doesn't conflict with data privacy rights.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Expert system. ","nodeType":"text"},{"data":{},"marks":[],"value":"Expert systems are AI systems used to simulate the judgment or behavior of a human expert.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Fréchet inception distance (FID). ","nodeType":"text"},{"data":{},"marks":[],"value":"FID is a metric for evaluating the quality of images created by generative AI.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Garbage in, garbage out (GIGO). ","nodeType":"text"},{"data":{},"marks":[],"value":"GIGO is a concept in computer science that states the quality of a system's output is based on the quality of the input. If the input is trash, the output will be trash. If AI is trained on low-quality data, then the user can expect its output to be shoddy as well.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Generative adversarial network (GAN). ","nodeType":"text"},{"data":{},"marks":[],"value":"A GAN is a type of machine learning that consists of two neural networks: one that generates data and one that discriminates and refines the data. The two neural networks compete to create more accurate predictions.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Generative AI. ","nodeType":"text"},{"data":{},"marks":[],"value":"Generative AI is an artificial intelligence technology that creates content by learning patterns in training data and synthesizing new material with the same learned characteristics.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Graphics processing unit (GPU). ","nodeType":"text"},{"data":{},"marks":[],"value":"A GPU is a type of processor that is suited to powering AI hardware because it can perform more simultaneous computations than a CPU.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Green AI.","nodeType":"text"},{"data":{},"marks":[],"value":" AI deployment that prioritizes energy efficiency and optimizes AI models to minimize carbon emissions and waste. Green AI balances innovation with environmental responsibility.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Grok.","nodeType":"text"},{"data":{},"marks":[],"value":" Grok is an AI chatbot developed by xAI for Elon Musk’s X (formerly Twitter).","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Generative pre-trained transformer (GPT).","nodeType":"text"},{"data":{},"marks":[],"value":" GPTs are the AI algorithms that power some of the most well-known natural language processing and generative algorithms. GPT-3, GPT-3.5 and GPT-4 are examples of the GPT family of algorithms. They were developed by OpenAI.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Hallucination. ","nodeType":"text"},{"data":{},"marks":[],"value":"An AI hallucination is when an AI system presents false information framed as the truth. For example, a chatbot prompted to write a five-page research report with citations and links might generate fake links that appear real but lead nowhere or fabricate quotes from public figures as evidence. A deepfake is different than a hallucination in that it is intentionally created as a hoax to trick the viewer.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Knowledge engineering. ","nodeType":"text"},{"data":{},"marks":[],"value":"Knowledge engineering is the field of AI that aims to emulate a human expert's knowledge in a certain field.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Large language model (LLM). ","nodeType":"text"},{"data":{},"marks":[],"value":"LLMs are deep learning algorithms that understand, summarize, generate and predict new content. They typically contain many parameters and are trained on a large corpus of unlabeled text. GPT-3 is an LLM.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Large Language Model Meta AI (LLaMA). ","nodeType":"text"},{"data":{},"marks":[],"value":"LLaMA is an open source LLM released by Meta.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Machine learning. ","nodeType":"text"},{"data":{},"marks":[],"value":"Machine learning is a type of AI algorithm that lets software applications become more accurate at predicting outcomes autonomously.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Moats. ","nodeType":"text"},{"data":{},"marks":[],"value":"Moats are mechanisms that prevent competitors from copying a proprietary LLM. An LLM's moats are training data, model weights and the cost of training.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Model. ","nodeType":"text"},{"data":{},"marks":[],"value":"An AI model is a machine learning algorithm that has been trained and deployed.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Multimodal AI. ","nodeType":"text"},{"data":{},"marks":[],"value":"Multimodal AI systems can handle input and produce output in several mediums. Multimodal systems can handle any combination of images, video, text or sound, as opposed to just text.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Model collapse. ","nodeType":"text"},{"data":{},"marks":[],"value":"Model collapse is when low-quality, AI-generated content contaminates the training set for future models.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Natural language generation (NLG). ","nodeType":"text"},{"data":{},"marks":[],"value":"NLG is the use of AI to produce written or spoken language from a data set.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Natural language processing (NLP). ","nodeType":"text"},{"data":{},"marks":[],"value":"NLP is the ability of a computer program to understand human language as it is spoken and written. It is a subfield of linguistics as well.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Neural network. ","nodeType":"text"},{"data":{},"marks":[],"value":"Neural networks are a type of deep learning technology made up of interconnected artificial neurons. The neurons are nodes that process and transmit information. Two of the main neural network types are recurrent neural networks and CNNs.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Neuromorphic computing. ","nodeType":"text"},{"data":{},"marks":[],"value":"Neuromorphic computing is a method in which computer design is modeled after elements of the human brain. It can apply to both hardware and software.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"OpenAI. ","nodeType":"text"},{"data":{},"marks":[],"value":"OpenAI is an American artificial intelligence company. It conducts AI research and has developed several AI models and services in the last decade, including GPT-3, ChatGPT and Dall-E.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Operational AI (AIOps).","nodeType":"text"},{"data":{},"marks":[],"value":" The application of AI systems for real-world business deployment in IT operations.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Overfitting. ","nodeType":"text"},{"data":{},"marks":[],"value":"Overfitting is a concept in data science where a statistical model conforms too tightly to its training data, harming its ability to process unseen data.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Parameter. ","nodeType":"text"},{"data":{},"marks":[],"value":"Parameters in AI refer to the internal settings that are learned by a machine learning model during the training process. Parameters augment the model's approach to pattern recognition.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Prompt.","nodeType":"text"},{"data":{},"marks":[],"value":" A prompt is input that a user feeds to an artificial intelligence system with some expected result. Some companies, such as GoDaddy and Uproer, produce prompt libraries to be used with generative AI applications, such as ChatGPT.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Pathways Language Model (PaLM).","nodeType":"text"},{"data":{},"marks":[],"value":" PaLM is Google's transformer-based LLM, based on similar technology to GPT-3 and GPT-4. The Google Bard chatbot runs on PaLM.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Prompt engineering.","nodeType":"text"},{"data":{},"marks":[],"value":" Prompt engineering is the process of developing and refining prompts for LLMs. Prompt engineering is used by AI engineers to refine LLMs and by generative AI users to hone the output they want from the model.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Q-learning. ","nodeType":"text"},{"data":{},"marks":[],"value":"Q-learning is a type of reinforcement learning that enables AI models to learn and improve iteratively over time.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Recommendation engine. ","nodeType":"text"},{"data":{},"marks":[],"value":"A recommendation engine is an AI algorithm that is used to serve users content based on their preferences. Social sites, such as TikTok, and streaming platforms, such as Spotify and YouTube, use recommendation engines to personalize user feeds.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Reinforcement learning. ","nodeType":"text"},{"data":{},"marks":[],"value":"Reinforcement learning is a machine learning training method that rewards desired behaviors and punishes undesired ones. Through reinforcement learning, a machine learning agent perceives its environment, takes action and learns through trial and error.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Reinforcement learning from human feedback (RLHF).","nodeType":"text"},{"data":{},"marks":[],"value":" RLHF trains models directly from human feedback, as opposed to from a coded reward stimulus. Humans may score a chatbot's output and feed those scores back into the model.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Responsible AI.","nodeType":"text"},{"data":{},"marks":[],"value":" Responsible AI is the ethical deployment of AI systems, with minimal bias and championing transparency and fairness.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Sentiment analysis. ","nodeType":"text"},{"data":{},"marks":[],"value":"Also known as ","nodeType":"text"},{"data":{},"marks":[{"type":"italic"}],"value":"opinion mining","nodeType":"text"},{"data":{},"marks":[],"value":", sentiment analysis is the process of analyzing text for tone and opinion with AI.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Shadow AI.","nodeType":"text"},{"data":{},"marks":[],"value":" Shadow AI refers to employees who use unapproved AI tools for work purposes, posing security, compliance and data security risk.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Supervised learning. ","nodeType":"text"},{"data":{},"marks":[],"value":"Supervised learning trains machine learning algorithms on data with labels, known as ","nodeType":"text"},{"data":{},"marks":[{"type":"italic"}],"value":"structured data","nodeType":"text"},{"data":{},"marks":[],"value":".","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Speech recognition.","nodeType":"text"},{"data":{},"marks":[],"value":" Speech recognition converts spoken language into text using AI.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Synthetic data. ","nodeType":"text"},{"data":{},"marks":[],"value":"Synthetic data is computer-generated information for testing and training AI models. Large AI models need large quantities of data to train on, which is traditionally generated in the real world.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Technological singularity. ","nodeType":"text"},{"data":{},"marks":[],"value":"The singularity describes a point in the future where advanced AI becomes more intelligent than humans and technological growth becomes uncontrollable.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Training data. ","nodeType":"text"},{"data":{},"marks":[],"value":"Training data refers to the information or examples used to train a machine learning model. AI models need a large training data set to learn patterns and guide their behavior.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Transformer. ","nodeType":"text"},{"data":{},"marks":[],"value":"Transformer models are","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":" ","nodeType":"text"},{"data":{},"marks":[],"value":"an AI model architecture used for NLP. Transformer-based models are neural networks that can uniquely process context and long-term dependencies in language.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Turing test. ","nodeType":"text"},{"data":{},"marks":[],"value":"The Turing test is a method of inquiry for determining if a computer is capable of thinking like a human being. The test was created by Alan Turing, an English computer scientist and cryptanalyst. A computer has intelligence if it can mimic human responses under certain conditions, according to the Turing test.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Token.","nodeType":"text"},{"data":{},"marks":[],"value":" A token is the basic unit of text that an LLM uses to understand and generate language. It may be a word or parts of a word. Paid LLMs, such as GPT-4's API, charge users by token.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Unsupervised learning.","nodeType":"text"},{"data":{},"marks":[],"value":" Unsupervised learning trains machine learning algorithms on data without labels, known as ","nodeType":"text"},{"data":{},"marks":[{"type":"italic"}],"value":"unstructured data","nodeType":"text"},{"data":{},"marks":[],"value":".","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Variational autoencoder. ","nodeType":"text"},{"data":{},"marks":[],"value":"Variational autoencoders are a generative AI model architecture commonly used for signal analysis and finding efficient coding of input data. They are comparable to GANs in that they pit two neural networks against each other -- an encoder and a decoder.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Vertical AI.","nodeType":"text"},{"data":{},"marks":[],"value":" These are AI systems designed for a specific industry or use case, such as healthcare, finance or retail, as opposed to general-purpose AI.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Vibe coding.","nodeType":"text"},{"data":{},"marks":[],"value":" A software development approach that uses AI to create code based on natural language prompts.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Zero-shot learning.","nodeType":"text"},{"data":{},"marks":[],"value":" Zero-shot learning is a machine learning technique where algorithms observe samples that were not present in training and predict what class they belong to. For example, an image classifier only trained to recognize cats would be told to classify an image of a lion knowing some extra information -- that lions are big cats.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"heroImage":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"sknPKniwKQbecnZ9WfMcy","type":"Asset","createdAt":"2025-11-10T05:11:49.275Z","updatedAt":"2025-11-10T05:11:49.275Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":7,"revision":1,"locale":"en-US"},"fields":{"title":"Artificial Intelligence glosssary Banner","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/sknPKniwKQbecnZ9WfMcy/afa8f80dfe2c8bd6f9d1548d1a280666/ai_a352095729.jpg","details":{"size":100898,"image":{"width":1200,"height":400}},"fileName":"ai_a352095729.jpg","contentType":"image/jpeg"}}},"date":"2025-11-10T00:00+05:30"}},{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"32r4BRM8MUxgeLOnxFmBcQ","type":"Entry","createdAt":"2025-10-27T05:50:46.853Z","updatedAt":"2025-10-28T11:36:32.671Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":65,"revision":2,"contentType":{"sys":{"type":"Link","linkType":"ContentType","id":"4iLx5UCNPIE6SrGNHluzUR"}},"locale":"en-US"},"fields":{"title":"Lessons Learned from 7 Years in Web & App Development","slug":"leasons-learned-from-seven-years-in-web-and-app-development","description":"Working in web and app development for over seven years has been an exciting rollercoaster — full of bugs, breakthroughs, and a lot of “aha!” moments. From writing my first line of code to leading complex full-stack projects, every phase has taught me something valuable. Here are some of the biggest lessons I’ve learned that might help both beginners and professionals in their own journeys.","content":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Working in web and app development for over seven years has been an exciting rollercoaster — full of bugs, breakthroughs, and a lot of “aha!” moments. From writing my first line of code to leading complex full-stack projects, every phase has taught me something valuable. Here are some of the biggest lessons I’ve learned that might help both beginners and professionals in their own journeys.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"1. The Basics Never Go Out of Style","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"No matter how advanced frameworks get, the fundamentals remain the backbone of everything.\n Understanding ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"HTML, CSS, and JavaScript","nodeType":"text"},{"data":{},"marks":[],"value":" deeply will always give you an edge. The same goes for core programming concepts like loops, functions, and data structures.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"\"","
