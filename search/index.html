e":"text"},{"data":{},"marks":[],"value":" deeply will always give you an edge. The same goes for core programming concepts like loops, functions, and data structures.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"\"","nodeType":"text"},{"data":{},"marks":[{"type":"italic"},{"type":"bold"}],"value":"Frameworks will come and go — but a solid foundation never fades.\"","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"2. Simplicity Beats Complexity","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"In the early days, I used to over-engineer solutions — building things that looked “smart” but were hard to maintain.\nNow I follow a simple rule:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"“","nodeType":"text"},{"data":{},"marks":[{"type":"italic"},{"type":"bold"}],"value":"If a junior developer can understand my code easily, I’ve done a good job.","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"”","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Clean, readable, and modular code is always better than clever one-liners that confuse everyone (including future you).","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"3. Reusability is Key","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Don’t repeat yourself.\nOnce you start building reusable ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"components, modules, and services","nodeType":"text"},{"data":{},"marks":[],"value":", development becomes faster and more consistent.\n","nodeType":"text"},{"data":{},"marks":[{"type":"italic"},{"type":"bold"}],"value":"For example","nodeType":"text"},{"data":{},"marks":[],"value":", in frontend development, reusable UI components (like buttons, modals, or form inputs) can save hours across multiple projects.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"4. Communication is as Important as Coding","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"I learned that being a good developer isn’t just about writing code — it’s about ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"understanding people","nodeType":"text"},{"data":{},"marks":[],"value":".\n Whether it’s explaining technical decisions to non-tech clients or collaborating with designers and testers, communication bridges the gap between chaos and clarity.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"5. Debugging is a Superpower","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Every developer faces bugs — some small, some really big ones.\n Over time, I realized debugging teaches more than tutorials ever could. It forces you to understand how the system ","nodeType":"text"},{"data":{},"marks":[{"type":"italic"}],"value":"actually","nodeType":"text"},{"data":{},"marks":[],"value":" works, not how you ","nodeType":"text"},{"data":{},"marks":[{"type":"italic"}],"value":"think","nodeType":"text"},{"data":{},"marks":[],"value":" it works.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"italic"},{"type":"bold"}],"value":"\"Don’t fear bugs — chase them down and learn from them.\"","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"6. Patience Pays Off","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Development can test your patience — failed builds, server crashes, and unexpected client requests can all happen in one day. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The key is to stay calm, take a deep breath, and approach problems one step at a time. Consistency and patience are what turn average developers into great ones.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"7. Always Keep Learning","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Technology evolves fast. What’s trending today might be outdated tomorrow.\n That’s why I’ve made continuous learning a habit — whether it’s exploring new frameworks like ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"Next.js","nodeType":"text"},{"data":{},"marks":[],"value":", trying backend tools like ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"NestJS","nodeType":"text"},{"data":{},"marks":[],"value":", or understanding ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"cloud deployments","nodeType":"text"},{"data":{},"marks":[],"value":". Or to exploring, understanding and using ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"AI ","nodeType":"text"},{"data":{},"marks":[],"value":"(buzzword of the decade).","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"\"","nodeType":"text"},{"data":{},"marks":[{"type":"italic"},{"type":"bold"}],"value":"Learning is not optional — it’s survival.\"","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"8. Real-World Projects Teach More Than Tutorials","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"You can watch 100 tutorials, but building even one real project teaches you more. When you face actual user needs, deadlines, and bugs, that’s when your real growth begins.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"9. Take Care of Yourself","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Developers often forget this — but burnout is real. Take breaks, exercise, and do things outside of code. A fresh mind writes better code.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[],"nodeType":"hr"},{"data":{},"content":[{"data":{},"marks":[],"value":"Final Thoughts","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"After 7+ years, if I had to summarize it all in one line, it would be:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"},{"type":"italic"}],"value":"“Great developers don’t just write code — they build solutions, learn continuously, and keep things simple.”","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Whether you’re just starting out or already deep in the tech world, remember — it’s a journey of growth, patience, and curiosity.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"heroImage":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"5SRi80d1GcLADqW38b73mP","type":"Asset","createdAt":"2025-10-22T22:44:00.309Z","updatedAt":"2025-10-22T22:44:00.309Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":5,"revision":1,"locale":"en-US"},"fields":{"title":"Ankush Kaura Animated GIF","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/5SRi80d1GcLADqW38b73mP/cc7641094fa618132ab6dc05a28754d1/ankush-kaura-animated.gif","details":{"size":3952346,"image":{"width":416,"height":752}},"fileName":"ankush-kaura-animated.gif","contentType":"image/gif"}}},"date":"2025-10-27T00:00+05:30"}},{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"7kyGZzXHLcfbp363gR6Agp","type":"Entry","createdAt":"2025-10-25T12:03:56.811Z","updatedAt":"2025-10-25T12:10:44.625Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":57,"revision":2,"contentType":{"sys":{"type":"Link","linkType":"ContentType","id":"4iLx5UCNPIE6SrGNHluzUR"}},"locale":"en-US"},"fields":{"title":"REST vs GraphQL: Choosing the Right API Design","slug":"rest-vs-graphql","description":"When building websites, mobile apps or any services that talk to a server, your application needs a way to fetch or update data. In tech‐speak this is done via an API (Application Programming Interface). But there’s more than one way to build an API. Two of the most popular approaches today are REST and GraphQL.","content":{"nodeType":"document","data":{},"content":[{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"Introduction","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"When building websites, mobile apps or any services that talk to a server, your application needs a way to fetch or update data. In tech‐speak this is done via an ","marks":[],"data":{}},{"nodeType":"text","value":"API (Application Programming Interface)","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":". But there’s more than one way to build an API. Two of the most popular approaches today are ","marks":[],"data":{}},{"nodeType":"text","value":"REST","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" and ","marks":[],"data":{}},{"nodeType":"text","value":"GraphQL","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[],"data":{}}]},{"nodeType":"embedded-asset-block","data":{"target":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"kDL6lEPtrYN1yfrrogqUD","type":"Asset","createdAt":"2025-10-25T11:51:40.164Z","updatedAt":"2025-10-25T11:51:40.164Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":5,"revision":1,"locale":"en-US"},"fields":{"title":"Rest vs GraphQL","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/kDL6lEPtrYN1yfrrogqUD/6241a3dd8aac6ce31ce7541b308c6a74/image.png","details":{"size":192785,"image":{"width":1000,"height":699}},"fileName":"image.png","contentType":"image/png"}}}},"content":[]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"In this post we’ll explain what each is, what their strengths and weaknesses are — and how to pick the right one for ","marks":[],"data":{}},{"nodeType":"text","value":"your","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" project. No heavy jargon, promise.","marks":[],"data":{}}]},{"nodeType":"hr","data":{},"content":[]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"What is REST?","marks":[],"data":{}}]},{"nodeType":"embedded-asset-block","data":{"target":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"3cQewTvSrhfwPfFA5wZNfG","type":"Asset","createdAt":"2025-10-25T11:49:41.345Z","updatedAt":"2025-10-25T11:49:41.345Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":3,"revision":1,"locale":"en-US"},"fields":{"title":"image","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/3cQewTvSrhfwPfFA5wZNfG/0a709213c4784b5553f267c601c3f6ac/image.png","details":{"size":127504,"image":{"width":788,"height":505}},"fileName":"image.png","contentType":"image/png"}}}},"content":[]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"REST stands for ","marks":[],"data":{}},{"nodeType":"text","value":"Representational State Transfer","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":". It’s not a protocol but an architectural style for building web services.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"The basic idea: you expose ","marks":[],"data":{}},{"nodeType":"text","value":"resources","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" (like users, posts, products) at distinct ","marks":[],"data":{}},{"nodeType":"text","value":"endpoints","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" (URLs), and you manipulate them using standard HTTP methods like GET (read), POST (create), PUT/PATCH (update), DELETE (remove).","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Example:","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"GET /users/123","marks":[{"type":"code"}],"data":{}},{"nodeType":"text","value":" → fetch user with ID 123","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"POST /users","marks":[{"type":"code"}],"data":{}},{"nodeType":"text","value":" → create a new user","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"PUT /users/123","marks":[{"type":"code"}],"data":{}},{"nodeType":"text","value":" → update user 123","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"DELETE /users/123","marks":[{"type":"code"}],"data":{}},{"nodeType":"text","value":" → delete user 123","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"REST has been around for many years and is well-understood, widely supported, with lots of tools, libraries, and patterns.","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"When REST is a good fit:","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Your data model is fairly stable and simple.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"The clients (apps/browsers) need fairly straightforward data, not huge nested or highly relational queries.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"You care about caching (browsers/proxies caching GET responses).","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"You have a team comfortable with REST tools and patterns.","marks":[],"data":{}}]}]}]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"What is GraphQL?","marks":[],"data":{}}]},{"nodeType":"embedded-asset-block","data":{"target":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"kDL6lEPtrYN1yfrrogqUD","type":"Asset","createdAt":"2025-10-25T11:51:40.164Z","updatedAt":"2025-10-25T11:51:40.164Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":5,"revision":1,"locale":"en-US"},"fields":{"title":"Rest vs GraphQL","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/kDL6lEPtrYN1yfrrogqUD/6241a3dd8aac6ce31ce7541b308c6a74/image.png","details":{"size":192785,"image":{"width":1000,"height":699}},"fileName":"image.png","contentType":"image/png"}}}},"content":[]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"GraphQL was developed (by Facebook) and open-sourced later. It’s a ","marks":[],"data":{}},{"nodeType":"text","value":"query language and runtime","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" for APIs.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Unlike REST which uses many endpoints, GraphQL generally uses a ","marks":[],"data":{}},{"nodeType":"text","value":"single endpoint","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" (e.g., ","marks":[],"data":{}},{"nodeType":"text","value":"/graphql","marks":[{"type":"code"}],"data":{}},{"nodeType":"text","value":") where the client sends a query stating exactly ","marks":[],"data":{}},{"nodeType":"text","value":"which fields","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" it wants, and the server returns exactly that data.\n\nExample query:\n{\n  user(id:\"123\") {\n    name\n    posts {\n      id\n      title\n    }\n  }\n}","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"That says: “Give me user 123’s name and their posts (IDs + titles)”.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"GraphQL is very flexible, especially when you have nested/related data or when clients have widely varying needs.\n","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"When GraphQL shines:","marks":[{"type":"bold"}],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"You have many different clients (mobile apps, web, IoT) that need different subsets of data.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"The data relationships are complex (e.g., users → orders → products → reviews).","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"You want to reduce “round-trips” (many endpoints calls) and over-fetching of unneeded data.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"You’re okay investing some extra effort for schema, tooling and handling some complexity.","marks":[],"data":{}}]}]}]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"REST vs GraphQL: Compare Side-by-Side","marks":[],"data":{}}]},{"nodeType":"embedded-asset-block","data":{"target":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"5SpoG89dhvWILlBfyJfBFa","type":"Asset","createdAt":"2025-10-25T12:03:27.345Z","updatedAt":"2025-10-25T12:03:27.345Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":6,"revision":1,"locale":"en-US"},"fields":{"title":"REST vs GraphQL Comparison","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/5SpoG89dhvWILlBfyJfBFa/bd9ce7bf9d16aab8d5d11125241a54b1/image.png","details":{"size":233258,"image":{"width":720,"height":768}},"fileName":"image.png","contentType":"image/png"}}}},"content":[]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"\nSo… Which Should You Choose?","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"It really depends on ","marks":[],"data":{}},{"nodeType":"text","value":"what you’re building","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":". Here are some practical questions to ask:","marks":[],"data":{}}]},{"nodeType":"ordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"How complex are your data relationships?","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If your data is mostly flat and you don’t have many nested relationships, REST is probably fine.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If you have many nested relations (e.g., user→posts→comments→likes) and many clients needing different slices, GraphQL may be better.","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Do clients need different subsets of data?","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If most clients ask for the ","marks":[],"data":{}},{"nodeType":"text","value":"same","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" data, REST is simple and efficient.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If mobile might need only a few fields, web another set, GraphQL’s flexibility wins.","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"How important is caching / performance of many clients?","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If you rely heavily on HTTP caching (e.g., browser, proxies), REST has an edge.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If you’re okay designing custom caching and optimizing queries, GraphQL can give richer client experiences.","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Do you want to minimise backend endpoints / versioning headaches?","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"REST endpoints may multiply and get versioned, increasing backend maintenance.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"With GraphQL you can often evolve your schema with less explicit versioning.","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"What’s your team’s experience?","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If your team knows REST very well and you have tight deadlines, go REST.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If you have the bandwidth to learn new tools, GraphQL is a strong choice for the future.","marks":[],"data":{}}]}]}]}]}]},{"nodeType":"hr","data":{},"content":[]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"Real-World Example","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Let’s imagine you’re building a blog platform:","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Using REST","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"You might have endpoints:","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"GET /users/123","marks":[{"type":"code"}],"data":{}},{"nodeType":"text","value":" → user info","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"GET /users/123/posts","marks":[{"type":"code"}],"data":{}},{"nodeType":"text","value":" → their posts","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"GET /posts/456/comments","marks":[{"type":"code"}],"data":{}},{"nodeType":"text","value":" → comments for a post","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If a mobile client needs user name, post titles, first comment, you may need 3+ requests and you might get ","marks":[],"data":{}},{"nodeType":"text","value":"more data","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" than needed.","marks":[],"data":{}}]}]}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Using GraphQL","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"You define a query:\n{\n  user(id:\"123\") {\n    name\n    posts {\n      title\n      comments {\n        author {\n          name\n        }\n        content\n      }\n    }\n  }\n}","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Client gets exactly what it asked for: name, post titles, comment authors & content — in one go.","marks":[],"data":{}}]}]}]},{"nodeType":"hr","data":{},"content":[]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"Pros & Cons Summary","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Pros of REST","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Simpler to understand and implement (especially for straightforward use cases).","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Works well with standard HTTP methods and caching.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Mature ecosystem, many tutorials, patterns.","marks":[],"data":{}}]}]}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Cons of REST","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"May lead to over-fetching or under-fetching data.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Many endpoints and versions can become messy.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Less flexible for clients with widely varying data needs.","marks":[],"data":{}}]}]}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Pros of GraphQL","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Clients request ","marks":[],"data":{}},{"nodeType":"text","value":"just","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" the data they need — more efficient.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"One endpoint, so backend endpoints don’t explode.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Great for front‐end flexibility and evolving data needs.","marks":[],"data":{}}]}]}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Cons of GraphQL","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Slightly more complex to set up: schema, resolvers, tools.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Standard HTTP caching is harder; must think about caching strategy.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If over-used, clients could make very heavy queries (need safeguards).","marks":[],"data":{}}]}]}]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"My Recommendation (For Your Blog Audience)","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Since you will publish this on your blogging website and likely address developers or tech-aware readers, here’s how you can frame it:","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If you’re starting a small project, or building something with fairly simple data, and you want speed and ease → ","marks":[],"data":{}},{"nodeType":"text","value":"choose REST","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If your project is bigger, has many different clients (web, mobile, maybe third-party), complex data needs, or you anticipate evolving requirements → ","marks":[],"data":{}},{"nodeType":"text","value":"go with GraphQL","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Remember: it’s not always ","marks":[],"data":{}},{"nodeType":"text","value":"one or the other","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":". Some systems use ","marks":[],"data":{}},{"nodeType":"text","value":"both","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":": REST for simple parts, GraphQL for complex ones.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Highlight that understanding trade-offs is more valuable than picking a “trend”.","marks":[],"data":{}}]}]}]},{"nodeType":"hr","data":{},"content":[]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"Conclusion","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"APIs are the backbone of modern apps. Getting the design right early saves headaches later.","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Use REST if you value simplicity, caching and your data model is stable.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Use GraphQL if you need flexibility, efficiency and expect your data needs / client demands to evolve.","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"","marks":[],"data":{}}]}]},"heroImage":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"kDL6lEPtrYN1yfrrogqUD","type":"Asset","createdAt":"2025-10-25T11:51:40.164Z","updatedAt":"2025-10-25T11:51:40.164Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":5,"revision":1,"locale":"en-US"},"fields":{"title":"Rest vs GraphQL","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/kDL6lEPtrYN1yfrrogqUD/6241a3dd8aac6ce31ce7541b308c6a74/image.png","details":{"size":192785,"image":{"width":1000,"height":699}},"fileName":"image.png","contentType":"image/png"}}},"date":"2025-10-25T00:00+05:30"}},{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"6KhaT7m1QhkC7TgEjhNhQn","type":"Entry","createdAt":"2025-10-24T19:18:00.316Z","updatedAt":"2025-10-24T19:18:00.316Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":21,"revision":1,"contentType":{"sys":{"type":"Link","linkType":"ContentType","id":"4iLx5UCNPIE6SrGNHluzUR"}},"locale":"en-US"},"fields":{"title":"Building Scalable Full-Stack Apps with Node.js + React.js","slug":"building-scalable-full-stack-apps-with-nodejs-plus-reactjs","description":"In today’s world of web apps and mobile apps, users expect things to be fast, smooth, and reliable no matter how many people use them. To build that kind of app you often need a full-stack setup: frontend (what the user sees) + backend (what the server does) + database/storage + scaling. In this blog we’ll talk about using Node.js (for the backend) and React.js (for the frontend) to build apps which are scalable (i.e., can handle growth) and user-friendly.","content":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Introduction","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"In today’s world of web apps and mobile apps, users expect things to be fast, smooth, and reliable no matter how many people use them. To build that kind of app you often need a ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"full-stack setup","nodeType":"text"},{"data":{},"marks":[],"value":": frontend (what the user sees) + backend (what the server does) + database/storage + scaling. In this blog we’ll talk about using Node.js (for the backend) and React.js (for the frontend) to build apps which are ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"scalable","nodeType":"text"},{"data":{},"marks":[],"value":" (i.e., can handle growth) and user-friendly.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{"target":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"4xw25mCDy4iX9DVj7TEcpq","type":"Asset","createdAt":"2025-10-24T19:13:40.626Z","updatedAt":"2025-10-24T19:13:40.626Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":7,"revision":1,"locale":"en-US"},"fields":{"title":"An Insigntful Guide on Full Stack Developement","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/4xw25mCDy4iX9DVj7TEcpq/0d06c586b104253add8dd11e05c8090d/image.png","details":{"size":336062,"image":{"width":942,"height":495}},"fileName":"image.png","contentType":"image/png"}}}},"content":[],"nodeType":"embedded-asset-block"},{"data":{},"content":[{"data":{},"marks":[],"value":"What exactly are Node.js and React.js?","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Let’s break them down in simple terms:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Node.js","nodeType":"text"},{"data":{},"marks":[],"value":": Think of it as a toolkit that lets you run JavaScript on the server (instead of just in the browser). You can build APIs, handle requests, talk to databases, manage files, etc.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"React.js","nodeType":"text"},{"data":{},"marks":[],"value":": A library (toolkit) for building user interfaces in the browser — the buttons, lists, pages, and the parts of your app the user interacts with.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"Why use them together? Because both use JavaScript, you can share ideas and sometimes code between frontend and backend, it simplifies the mental load. You don’t have to learn a completely different language for server vs browser.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{"target":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"3qt4KnLmPsBRNhGk9pnSyq","type":"Asset","createdAt":"2025-10-24T19:16:04.051Z","updatedAt":"2025-10-24T19:16:04.051Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":3,"revision":1,"locale":"en-US"},"fields":{"title":"image","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/3qt4KnLmPsBRNhGk9pnSyq/45239d7a2c0308791a69a683b7242b2a/image.png","details":{"size":241206,"image":{"width":800,"height":445}},"fileName":"image.png","contentType":"image/png"}}}},"content":[],"nodeType":"embedded-asset-block"},{"data":{},"content":[{"data":{},"marks":[],"value":"Why build scalable apps?","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Scalable means: your app works well even when lots of people use it, data grows, new features get added. Here are key points:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Handling growth","nodeType":"text"},{"data":{},"marks":[],"value":": More users, more requests, more data. The system should cope without crashing or becoming extremely slow.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Maintainability","nodeType":"text"},{"data":{},"marks":[],"value":": As your app grows, you want to avoid spaghetti code. Using clean structure + good tools helps.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Cost & performance","nodeType":"text"},{"data":{},"marks":[],"value":": Inefficient apps cost more (servers, bandwidth). If you build smarter, you save money and deliver better experience.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Future-proofing","nodeType":"text"},{"data":{},"marks":[],"value":": You might start small, but you want to be ready for bigger usage, new features, maybe mobile etc.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[],"nodeType":"hr"},{"data":{},"content":[{"data":{},"marks":[],"value":"How does Node.js + React.js help with scalability?","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Here are ways this tech stack supports building scalable full-stack apps:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Same language across stack","nodeType":"text"},{"data":{},"marks":[],"value":"\n Because both frontend and backend use JavaScript (Node on the server, React in browser), you don’t need developers switching mental context or learning many languages. This speeds up development and reduces mis-communication.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Componentised frontend","nodeType":"text"},{"data":{},"marks":[],"value":"\n React lets you build UI as pieces (components) which you can reuse. That means when your app grows, you won’t recreate everything; you reuse. It also helps maintainability.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Efficient backend with Node.js","nodeType":"text"},{"data":{},"marks":[],"value":"\n Node is built with a non-blocking model: it can handle many simultaneous requests without waiting for each one to finish before starting the next. That’s good for handling lots of users.\n Also many packages and tools (npm modules) help you scale (e.g., clustering, micro-services, caching).","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Clear separation of concerns","nodeType":"text"},{"data":{},"marks":[],"value":"\n React handles UI, Node handles server logic. You can evolve each part independently. For example you can scale your server infrastructure separately from your frontend rendering.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Modern tools & ecosystem","nodeType":"text"},{"data":{},"marks":[],"value":"\n The Node + React ecosystem has lots of libraries/modules, strong community, deployment options (cloud, containers, serverless). That means you can pick tools that scale and integrate well.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"ordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"A simple blueprint: how to structure your full-stack app","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Here’s a high-level blueprint for how you might organise a scalable Node + React full-stack app:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Frontend (React)","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"React components for UI (buttons, forms, lists)","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"State management (e.g., using React’s built-in hooks or a library)","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Routing (single-page app) so user navigates without full page reloads","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"API calls to backend (fetch/axios) to get/post data","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"Backend (Node)","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Express.js (or another framework) for handling HTTP requests","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Define RESTful APIs (or GraphQL) which frontend uses","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Handle authentication/authorization","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Talk to database (SQL or NoSQL)","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Business logic (what your app “does”)","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Logging, error handling, monitoring","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"Database & Storage","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Choose based on your use case: relational (SQL) or document (NoSQL)","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Use connection pooling, indexing, queries optimized for growth","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Possibly caching layer (Redis/Memcached) for speed","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"Deployment & Scaling","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Deploy backend and frontend (can be separate)","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Use environment variables for config (so you can change without code)","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Monitoring (logs, metrics) to see when things get slow","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Horizontal scaling: adding more instances rather than one big machine","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Use of containers (Docker), orchestration (Kubernetes) perhaps","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Use CDN for static assets (images, scripts) so front-end is fast","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[],"nodeType":"hr"},{"data":{},"content":[{"data":{},"marks":[],"value":"Practical tips and best practices","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Here are some suggestions to help you build right from the start (so you don’t regret later):","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Keep your code modular (both frontend and backend). Small components/functions are easier to test and scale.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Version control (Git) and branching strategy: you’ll thank yourself later.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Write automated tests: unit tests and integration tests, so changes don’t break things.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Use environment specific configs (dev, test, prod) so you can change behaviour based on where app runs.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Monitor performance early: track response times, error rates, user behaviour.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Optimize your database queries: when you have lots of data, slow queries will kill you.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Use caching where it makes sense.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Use asynchronous operations in backend (Node supports this) so you’re not blocking threads.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Keep security in mind: validate inputs, protect endpoints, secure secrets.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"For frontend, lazy-load heavy parts (so initial load is fast), minimise bundle size.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Use static hosting or CDNs for the React build where possible (since static assets scale well).","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[],"nodeType":"hr"},{"data":{},"content":[{"data":{},"marks":[],"value":"Example scenario: Imagine a task-manager app","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Let’s walk through a simple example to bring it all together. Suppose you’re building a “task-manager” web app for teams:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Frontend React: shows list of tasks, create new task form, edit task modal, user login.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Backend Node: endpoints like ","nodeType":"text"},{"data":{},"marks":[{"type":"code"}],"value":"/api/tasks","nodeType":"text"},{"data":{},"marks":[],"value":" (GET, POST, PUT, DELETE), ","nodeType":"text"},{"data":{},"marks":[{"type":"code"}],"value":"/api/users/login","nodeType":"text"},{"data":{},"marks":[],"value":", ","nodeType":"text"},{"data":{},"marks":[{"type":"code"}],"value":"/api/users/register","nodeType":"text"},{"data":{},"marks":[],"value":".","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Database: tasks collection/table with fields like id, title, description, assignedTo, status, createdAt.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Deployment: react build hosted on a static host + CDN for js/css/images; node backend runs in a cloud server/instance. Load-balancer sits in front if many users.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Scaling: if 100 users it’s fine; if 10,000 users you add more backend instances, database maybe shard or optimise queries, caching of frequent queries (e.g., tasks list) so you're not hitting DB for every request.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Maintenance: React components are reused (TaskItem, TaskList, TaskForm), backend modules separated (routes, controllers, services). Tests ensure tasks logic still works when you change something.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"ordered-list"},{"data":{},"content":[],"nodeType":"hr"},{"data":{},"content":[{"data":{},"marks":[],"value":"Common challenges & how to overcome them","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Even with Node + React, building a truly scalable app isn’t trivial. Here are some challenges and responses:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Too many simultaneous requests","nodeType":"text"},{"data":{},"marks":[],"value":": If backend isn’t asynchronous or blocking, you’ll be bottlenecked. Use Node’s non-blocking model, thread pools if needed.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Slow database queries","nodeType":"text"},{"data":{},"marks":[],"value":": If you don’t index or use proper queries, slowdown. Monitor DB, optimise, use caching.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Large frontend bundle","nodeType":"text"},{"data":{},"marks":[],"value":": If React build is huge, load time suffers especially on mobile. Solve by code-splitting, lazy loading, compressing assets.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Poor modularity","nodeType":"text"},{"data":{},"marks":[],"value":": One huge file for everything = hard to maintain. Keep modules/components small and well-defined.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Deployment complexity","nodeType":"text"},{"data":{},"marks":[],"value":": Scaling might mean deploying multiple services, maybe micro-services. Start simple but design so you can evolve.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Security & auth","nodeType":"text"},{"data":{},"marks":[],"value":": When you grow, user accounts, permissions, data protection become critical. Don’t ignore these for early version.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"State management complexity","nodeType":"text"},{"data":{},"marks":[],"value":": As frontend gets bigger, managing state (which component has what data) becomes tricky. Use appropriate state libs or React context wisely.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[],"nodeType":"hr"},{"data":{},"content":[{"data":{},"marks":[],"value":"Why this stack is a good fit right now","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"JavaScript is everywhere: you don’t need separate languages for front & back.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"React is extremely popular and well supported: lots of community, libraries, learning materials.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Node.js is also very mature: many companies use it for backend services.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"There are tons of starter kits (boilerplates), templates, open-source code to speed you up.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Because of popularity, hiring developers (or yourself learning) is easier.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"It aligns with modern deployment practices: micro-services, serverless, containerised deployments.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[],"nodeType":"hr"},{"data":{},"content":[{"data":{},"marks":[],"value":"Final thoughts","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"If you’re planning to build a full-stack web app that you expect to grow (more users, more features, more data) then choosing the right stack and architecture from early on matters a lot. Using Node.js + React.js gives you a strong foundation: same language, strong communities, modular components, scalable architecture.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Start with a clean structure, adopt best practices, keep performance and maintenance in mind — and you’ll save yourself a lot of pain later when your app grows.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The key: build ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"smart","nodeType":"text"},{"data":{},"marks":[],"value":", build ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"scalable","nodeType":"text"},{"data":{},"marks":[],"value":".","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"heroImage":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"4xw25mCDy4iX9DVj7TEcpq","type":"Asset","createdAt":"2025-10-24T19:13:40.626Z","updatedAt":"2025-10-24T19:13:40.626Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":7,"revision":1,"locale":"en-US"},"fields":{"title":"An Insigntful Guide on Full Stack Developement","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/4xw25mCDy4iX9DVj7TEcpq/0d06c586b104253add8dd11e05c8090d/image.png","details":{"size":336062,"image":{"width":942,"height":495}},"fileName":"image.png","contentType":"image/png"}}},"date":"2025-10-25T00:00+05:30"}},{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"7gH3e7TUh9pwEMIoQLwSL4","type":"Entry","createdAt":"2025-10-24T18:13:46.243Z","updatedAt":"2025-10-24T18:57:34.549Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":27,"revision":7,"contentType":{"sys":{"type":"Link","linkType":"ContentType","id":"4iLx5UCNPIE6SrGNHluzUR"}},"locale":"en-US"},"fields":{"title":"Why Is AI Design Bad ?","slug":"why-is-ai-design-bad","description":"AI design tools are everywhere now. If you’re a designer, you’ve probably used a handful of them to erase a background, clean up a layer stack, or power through a tedious round of resizing. Some features genuinely speed things up, but a lot of the biggest “design for you” promises bring way more clutter than insight. Let’s break down why design is so hard for AI and where it can actually help.\n\nThe design challenge AI hasn’t solved (yet)\nAI’s sweet spot is anything that runs on clear rules.","content":{"nodeType":"document","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"AI design tools are everywhere now. If you’re a designer, you’ve probably used a handful of them to erase a background, clean up a layer stack, or power through a tedious round of resizing.Some features genuinely speed things up, but a lot of the biggest “design for you” promises bring way more clutter than insight.Let’s break down why design is so hard for AI and where it can actually help.","marks":[],"data":{}}]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"The design challenge AI hasn’t solved (yet)","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"AI’s sweet spot is anything that runs on clear rules.Think about tedious, repeatable work, like changing all the font sizes to match a new style guide, tidying up layer names, or cleaning up color swatches that snuck in from old projects. This is the “left-brained” side of design, and machines do great here because every fix follows a recipe: if it doesn’t match, it needs to be fixed.","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"This is why AI excels at code","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Development is full of boring clean-up jobs, kinda like erasing the background of a photo. Since way before modern AI, developers have been leaning on automation to keep code tidy, check for bugs, and handle thousands of details no one wants to fuss over.These hard-coded rules in code give AI agents something to iterate against, so that by the time the developer sees the result, it’s already functional or even complete.","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"But ","marks":[],"data":{}},{"nodeType":"text","value":"design","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" isn’t really about neat files and pixel-perfect icons. The real fun starts when the rules become suggestions. Break a grid, stretch a headline, or pick an unexpected color, and your work goes from fine to unforgettable.Here, there’s no checklist or error alert. AI hits a wall the moment you ask it to chase a vibe, nail a subtle brand feeling, or make a creative leap born from pure intuition. That’s because these are ","marks":[],"data":{}},{"nodeType":"text","value":"human","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" moves, and they’re what take a design from solid to special.AI can help keep things tidy and match the system, but when it’s time to work outside the lines, it needs a real designer in the driver’s seat.","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"And it’s a similar story with language","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"AI handles grammar, syntax, and even basic writing style because each correction relies on well-defined patterns, such as catching typos or fixing awkward sentences in a writer’s draft.Plus, when you work with AI in a writing tool, you’re ","marks":[],"data":{}},{"nodeType":"text","value":"always","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" in the loop. You prompt, edit, and guide ","marks":[],"data":{}},{"nodeType":"text","value":"in natural language.","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" You steer the conversation in the same medium as the desired output.In design, this built-in feedback loop is missing from most AI tools. Instead of responding to your visual moves on a canvas, they expect you to describe your intent in words... and then spend all your time fixing what the AI thought you meant. Prompt fatigue is real.For AI to actually help with design, it has to be looped into visual editing. It needs to watch your (very human, creative) choices and pick up your intent from each pixel shift or layout twist.","marks":[],"data":{}}]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"Why most AI tools disappoint designers","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Most AI tools get marketed as replacements for designers, which misses the point entirely. Big promises—press a button, get a finished layout, skip hours of tinkering—sound appealing until you open tools like Figma First Draft or Canva Magic Design and realize the “magic” is usually a pile of generic elements, often disconnected from your brand or vision.The problem is, instead of organizing your work for the next round, most AI tools encourage duplicating over componentizing and layering. After every “auto” option, you’re left cleaning up messy layers, copy-pasted elements, forgotten color swatches, and components that should’ve been reused but aren’t.When tools crowd your workspace with disconnected scraps, your intent gets diluted and your flow grinds to a halt.Designers need smart reuse, clear hierarchy, and tools that help keep things maintainable. That’s code’s advantage, and it’s where design tech needs to go.","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"In an ideal world, designers would just… design","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Picture this: you open your tool, start moving elements, and your visual edits update the ","marks":[],"data":{}},{"nodeType":"text","value":"real","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" website live.You don’t have to type prompts, guess at what the final will look like, or jump through extra handoff hoops. Every shift, resize, and style update lands instantly, with brand intent intact.The AI doesn’t pitch ideas over the fence or clutter up your file with half-finished templates. It follows your lead, tidying the workspace, snapping details into place, and staying invisible unless you need an extra hand.Your creative choices, the ones that set the vibe or break a rule on purpose, actually show up in production the way you build them.This, fundamentally, is our goal for designers using Fusion. And we can do that by integrating with your existing design system.","marks":[],"data":{}}]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"Design systems, component reuse, and clean design at scale","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Design systems and component libraries are the backbone of modern product teams. When you build with reusable components, like buttons, cards, and navbars, you get consistency across your whole product. Brand colors don’t drift, layouts stay tidy, and a single fix updates everywhere it’s used. This is how the best teams scale design while keeping everything on-brand.AI’s biggest win in design isn’t about creating things from scratch; it’s about working inside these systems. When AI understands your component library and design tokens, it can instantly pull in the right pieces, organize layers, and keep all your updates perfectly synced.That’s the real answer to design clutter: component-based edits that stay tidy and get deployed everywhere instead of endless copying and pasting.Designing ","marks":[],"data":{}},{"nodeType":"text","value":"in code","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" means edits are non-destructive and always consistent. This is exactly what Fusion unlocks: every visual change you make instantly updates in code, keeps your system tight, and removes the headache of manual cleanup.","marks":[],"data":{}}]},{"nodeType":"heading-2","data":{},"content":[{"nodeType":"text","value":"Fusion: Your visual edits are the AI’s instructions","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Fusion flips the script for designers working in code. Instead of asking for prompts or generating artifacts you have to reconcile, Fusion keeps you in your natural workflow.You move, resize, and arrange real components on a live canvas. Every change you make gets instantly applied to your real codebase (in draft mode), mapped to the design system your team lives by.","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"What makes Fusion different is how it interprets your creative intent. When you make a visual edit, like scaling up a hero headline, breaking a grid, or swapping out a button, Fusion’s AI pays attention to the differences between your edit and what was there before.It writes those changes directly to code that your developers can review, keeping everything clean, brand-consistent, and easy to manage.","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"The interface stays lean. Fusion organizes layers, enforces system logic, and keeps your workspace free from clutter. You get to focus on the fun, rule-breaking side of design while the AI handles the rest.You don’t have to worry about disconnected mockups, inaccurate handoffs, and long review cycles. You design visually, Fusion “listens” to those moves, and your edits get reflected in the live product with clean, reusable components pulled straight from your library.","marks":[],"data":{}}]}]},"heroImage":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"2y2ueqm0l7y8"}},"id":"2feE70SE31AkHQTQh43TGX","type":"Asset","createdAt":"2025-10-24T18:41:52.778Z","updatedAt":"2025-10-24T18:41:52.778Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":6,"revision":1,"locale":"en-US"},"fields":{"title":"Why is AI design Bad ?","description":"","file":{"url":"//images.ctfassets.net/2y2ueqm0l7y8/2feE70SE31AkHQTQh43TGX/ae3767d501cd894c57307c4095661d3f/Screenshot_2025-10-25_at_12.10.42â__AM.png","details":{"size":652488,"image":{"width":2390,"height":996}},"fileName":"Screenshot 2025-10-25 at 12.10.42 AM.png","contentType":"image/png"}}},"date":"2025-10-24T00:00+05:30"}}];

  const searchInput = document.getElementById('search-input')
  const searchResults = document.getElementById('search-results')

  function normalizeText(text) {
    return text.toLowerCase().trim()
  }

  function highlightText(text, query) {
    if (!query) return text
    const regex = new RegExp(`(${query})`, 'gi')
    return text.replace(regex, '<mark class="bg-yellow-200 dark:bg-yellow-800">$1</mark>')
  }

  function searchContent(query) {
    if (!query || query.length < 2) {
      searchResults.innerHTML =
        '<p class="text-muted-foreground">Type to search through blogs and projects...</p>'
      return
    }

    const normalizedQuery = normalizeText(query)
    const results = []

    // Search blogs
    blogs.forEach((blog) => {
      const title = blog.fields.title || ''
      const description = blog.fields.description || ''
      const slug = blog.fields.slug || ''

      if (
        normalizeText(title).includes(normalizedQuery) ||
        normalizeText(description).includes(normalizedQuery)
      ) {
        results.push({
          type: 'blog',
          title: title,
          description: description,
          slug: slug,
          date: blog.fields.date,
          image: blog.fields.heroImage,
        })
      }
    })

    // Search projects
    projects.forEach((project) => {
      const name = project.fields.name || ''
      const description = project.fields.description || ''
      const link = project.fields.link || ''

      if (
        normalizeText(name).includes(normalizedQuery) ||
        normalizeText(description).includes(normalizedQuery)
      ) {
        results.push({
          type: 'project',
          name: name,
          description: description,
          link: link,
          image: project.fields.image,
        })
      }
    })

    // Display results
    if (results.length === 0) {
      searchResults.innerHTML =
        '<p class="text-muted-foreground">No results found for "' +
        query +
        '"</p>'
    } else {
      searchResults.innerHTML = `
        <div class="space-y-4">
          <p class="text-sm text-muted-foreground">Found ${results.length} result${results.length > 1 ? 's' : ''}</p>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3">
            ${results
              .map((result) => {
                if (result.type === 'blog') {
                  const imageUrl = result.image?.fields?.file?.url
                    ? 'https:' + result.image.fields.file.url
                    : '/me.png'
                  const imageAlt =
                    result.image?.fields?.title || result.title
                  return '<a href="/blog/' + result.slug + '" class="block">' +
                    '<div class="overflow-hidden rounded-lg border border-white/20 bg-white/10 shadow-lg backdrop-blur-lg transition hover:border-primary hover:bg-white/20">' +
                      '<img src="' + imageUrl + '" alt="' + imageAlt + '" class="h-40 w-full object-cover" loading="lazy" />' +
                      '<div class="p-4">' +
                        '<h3 class="text-lg font-semibold">' + highlightText(result.title, query) + '</h3>' +
                        '<p class="mt-1 text-sm text-muted-foreground line-clamp-3">' + highlightText(result.description, query) + '</p>' +
                        '<p class="mt-2 text-xs text-gray-500">' + new Date(result.date).toLocaleDateString() + '</p>' +
                      '</div>' +
                    '</div>' +
                  '</a>'
                } else {
                  const imageUrl = result.image?.fields?.file?.url
                    ? 'https:' + result.image.fields.file.url
                    : '/me.png'
                  const imageAlt = result.image?.fields?.title || result.name
                  return '<a href="' + result.link + '" target="_blank" rel="noopener noreferrer" class="block">' +
                    '<div class="overflow-hidden rounded-lg border border-white/20 bg-white/10 shadow-lg backdrop-blur-lg transition hover:border-primary hover:bg-white/20">' +
                      '<img src="' + imageUrl + '" alt="' + imageAlt + '" class="h-40 w-full object-cover" loading="lazy" />' +
                      '<div class="p-4">' +
                        '<h3 class="text-lg font-semibold">' + highlightText(result.name, query) + '</h3>' +
                        '<p class="mt-1 text-sm text-muted-foreground line-clamp-3">' + highlightText(result.description, query) + '</p>' +
                      '</div>' +
                    '</div>' +
                  '</a>'
                }
              })
              .join('')}
          </div>
        </div>
      `
    }

    // Track search event
    if (window.gtag) {
      window.gtag('event', 'search', {
        search_term: query,
        results_count: results.length,
      })
    }
  }

  // Debounce function
  function debounce(func, wait) {
    let timeout
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout)
        func(...args)
      }
      clearTimeout(timeout)
      timeout = setTimeout(later, wait)
    }
  }

  const debouncedSearch = debounce(searchContent, 300)

  searchInput.addEventListener('input', (e) => {
    debouncedSearch(e.target.value)
  })

  // Handle URL parameters for direct search
  const urlParams = new URLSearchParams(window.location.search)
  const queryParam = urlParams.get('q')
  if (queryParam) {
    searchInput.value = queryParam
    searchContent(queryParam)
  }
})();</script>
